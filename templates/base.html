<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GrillKit{% endblock %}</title>
    <script>
        /* Apply theme before first paint to avoid a flash of the wrong theme. */
        (function () {
            var stored = null;
            try { stored = localStorage.getItem("grillkit-theme"); } catch (e) {}
            var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ static_version('css/styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-container{% block app_class %}{% endblock %}">
        <nav class="navbar">
            <a href="/" class="navbar-brand">GrillKit</a>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link">Dashboard</a></li>
                <li><a href="/setup" class="nav-link">New Interview</a></li>
                <li><a href="/known-questions/manage" class="nav-link">Known Questions</a></li>
                <li><a href="/config" class="nav-link">Configuration</a></li>
            </ul>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" data-theme-toggle>
                <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">&#x2600;</span>
                <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">&#x263D;</span>
            </button>
        </nav>

        <main class="main-content{% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        (function () {
            var toggle = document.querySelector("[data-theme-toggle]");
            if (!toggle) return;
            toggle.addEventListener("click", function () {
                var root = document.documentElement;
                var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-theme", next);
                try { localStorage.setItem("grillkit-theme", next); } catch (e) {}
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
